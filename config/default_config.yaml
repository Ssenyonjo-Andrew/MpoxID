# Default configuration for Mpox clade classifier
# Lab technicians: edit quality thresholds here if your sequencing chemistry differs.

project:
  name: mpox_clade_classifier
  version: "1.0.0"
  random_seed: 42

clades:
  labels: ["Ia", "Ib", "IIa", "IIb"]

features:
  kmer_sizes: [2, 3, 4]
  use_canonical_kmers: true          # RC-collapse to cut dimensionality ~2x
  include_composition: true
  include_codon_usage: true
  codon_frame_search: true           # try frames 0,1,2; pick fewest stops / longest ORF

quality:
  # Deterministic rules (NOT learned). Tunable for lab chemistry / assembler.
  n_pct_fair: 1.0                    # %N above this → at best Fair
  n_pct_poor: 5.0                    # %N above this → Poor
  non_acgtn_fair: 5                  # raw count thresholds
  non_acgtn_poor: 50
  premature_stops_fair: 1
  premature_stops_poor: 5
  frameshift_implies_at_best: Fair   # if frameshift flag set, max quality = Fair
  min_length_fair: 150000            # near-complete MPXV ~197kb; short assemblies are Fair/Poor
  min_length_poor: 50000

training:
  test_size: 0.2
  n_cv_folds: 5
  class_weight: balanced             # handle Ia/Ib/IIa/IIb imbalance
  models:
    - logistic_regression
    - random_forest
    - xgboost
  deploy_model: xgboost              # primary offline deployment artifact

paths:
  raw_fasta: data/raw
  metadata: data/metadata/metadata.csv
  processed_features: data/processed/features.parquet
  models_dir: models
  reports_dir: reports

inference:
  confidence_decimals: 4
  top_kmers_per_clade: 10
