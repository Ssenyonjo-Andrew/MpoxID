[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpox-clf"
version = "1.0.0"
description = "Offline CPU Mpox (MPXV) clade classifier for low-resource labs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "biopython==1.84",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.5.1",
  "xgboost==2.1.1",
  "joblib==1.4.2",
  "streamlit==1.37.1",
  "pyyaml==6.0.2",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyright]
include = ["src", "app", "scripts", "tests"]
extraPaths = [".", "src", "app"]

